name: Cross-Platform Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.5.0)'
        required: false
        default: 'v0.5.0'
      draft:
        description: 'Create as draft release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows NSIS installer
        run: npm run dist

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/FlyingMouse Format-Setup-0.5.0-x64.exe
          if-no-files-found: error

      - name: Upload Windows blockmap
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/FlyingMouse Format-Setup-0.5.0-x64.exe.blockmap
          if-no-files-found: warn

      - name: Upload Windows latest.yml
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/latest.yml
          if-no-files-found: warn

  build-linux:
    name: Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux AppImage
        run: npx electron-builder --linux appimage --x64 --publish never

      - name: Build Linux deb
        run: npx electron-builder --linux deb --x64 --publish never

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*-0.5.0-x64.AppImage
          if-no-files-found: error

      - name: Upload Linux deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*-0.5.0_amd64.deb
          if-no-files-found: error

  build-macos-arm64:
    name: macOS arm64
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS arm64 DMG
        run: npx electron-builder --mac dmg --arm64 --publish never

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/FlyingMouse Format-Setup-0.5.0-mac-arm64.dmg
          if-no-files-found: error

  build-macos-x64:
    name: macOS x64
    runs-on: macos-13
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS x64 DMG
        run: npx electron-builder --mac dmg --x64 --publish never

      - name: Upload macOS x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: dist/FlyingMouse Format-Setup-0.5.0-mac-x64.dmg
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos-arm64, build-macos-x64]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false

      - name: Rename files (replace spaces with hyphens)
        run: |
          cd release-assets
          for dir in */; do
            [ -d "$dir" ] || continue
            cd "$dir"
            for f in *; do
              [ -f "$f" ] || continue
              n="$(echo "$f" | tr ' ' '-')"
              [ "$f" = "$n" ] || mv "$f" "$n"
            done
            cd ..
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || 'v0.5.0' }}"
          DRAFT="--draft"
          if [ "${{ github.event.inputs.draft }}" = "false" ]; then DRAFT=""; fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "FlyingMouse Format $TAG" \
            --notes "Cross-platform build artifacts." \
            $DRAFT \
            release-assets/windows-x64/* \
            release-assets/linux-appimage/* \
            release-assets/linux-deb/* \
            release-assets/macos-arm64/* \
            release-assets/macos-x64/*
